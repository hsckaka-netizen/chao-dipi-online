  <g id="YOUR_FRAME_ARTWORK" />
  <g id="GUIDES_DO_NOT_EXPORT" font-family="Arial, sans-serif" font-size="13" fill="none">
    <rect width="512" height="512" fill="#f4f6f5" />
    <path d="M0 0h512v512H0zM92 92h328v328H92z" fill="#4f8f7b" fill-opacity="0.12" fill-rule="evenodd" />
    <rect x="8" y="8" width="496" height="496" rx="12" stroke="#d48828" stroke-width="2" stroke-dasharray="8 6" />
    <rect x="92" y="92" width="328" height="328" rx="52" fill="#d73e55" fill-opacity="0.08" stroke="#d73e55" stroke-width="2" stroke-dasharray="8 6" />
    <rect x="20" y="8" width="472" height="84" rx="12" fill="#2878c8" fill-opacity="0.08" stroke="#2878c8" stroke-dasharray="6 5" />
    <rect x="52" y="92" width="40" height="328" rx="12" fill="#7a55aa" fill-opacity="0.08" stroke="#7a55aa" stroke-dasharray="6 5" />
    <rect x="420" y="92" width="40" height="328" rx="12" fill="#7a55aa" fill-opacity="0.08" stroke="#7a55aa" stroke-dasharray="6 5" />
    <rect x="20" y="420" width="472" height="84" rx="12" fill="#2878c8" fill-opacity="0.08" stroke="#2878c8" stroke-dasharray="6 5" />
    <circle cx="58" cy="58" r="34" fill="#c34848" fill-opacity="0.08" stroke="#c34848" stroke-dasharray="4 4" />
    <circle cx="454" cy="58" r="34" fill="#c34848" fill-opacity="0.08" stroke="#c34848" stroke-dasharray="4 4" />
    <g fill="#26342f" stroke="none">
      <text x="16" y="28">8 px 透明外边距</text>
      <text x="256" y="250" text-anchor="middle">头像开口 328 × 328</text>
      <text x="256" y="270" text-anchor="middle">此区域 Alpha 必须为 0</text>
