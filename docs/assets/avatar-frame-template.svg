<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>炒地皮头像框 512px 坐标模板</title>
  <desc>设计完成后隐藏 GUIDES_DO_NOT_EXPORT 图层，只导出设计图层。</desc>
  <g id="YOUR_FRAME_ARTWORK" />
  <g id="GUIDES_DO_NOT_EXPORT" font-family="Arial, sans-serif" font-size="13" fill="none">
    <rect width="512" height="512" fill="#f4f6f5" />
    <rect x="8" y="8" width="496" height="496" rx="12" stroke="#d48828" stroke-width="2" stroke-dasharray="8 6" />
    <rect x="70" y="70" width="372" height="372" stroke="#16744c" stroke-width="3" />
    <path d="M70 70H442V442H70Z" stroke="#116a55" stroke-width="10" stroke-opacity="0.18" />
    <g fill="#26342f" stroke="none">
      <text x="16" y="28">8 px 透明外边距</text>
      <text x="256" y="56" text-anchor="middle">绿色实线：372 × 372 px 虚拟框架（不导出）</text>
      <text x="256" y="88" text-anchor="middle">头像外沿与虚拟框架重合</text>
      <text x="256" y="244" text-anchor="middle">素材内部不设强制透明区</text>
      <text x="256" y="264" text-anchor="middle">可见设计可向虚拟框架内外完整延伸</text>
      <text x="256" y="284" text-anchor="middle">禁止按矩形区域裁切内部设计</text>
      <text x="256" y="458" text-anchor="middle">框体沿虚拟框架四边连续闭合</text>
      <text x="256" y="478" text-anchor="middle">除设计本体外，其他区域全透明</text>
    </g>
    <path d="M256 0v512M0 256h512" stroke="#26342f" stroke-opacity="0.22" stroke-dasharray="3 5" />
  </g>
</svg>
